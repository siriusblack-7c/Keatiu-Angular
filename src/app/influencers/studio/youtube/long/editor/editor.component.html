<mat-card class="mat-elevation-z4">
  <mat-card-header>
    <mat-card-title>
      <h1>Generador de guiones para YouTube</h1>
    </mat-card-title>
    <mat-card-subtitle>
      <p>Escribe tu idea y déjate inspirar por nuestras sugerencias. Obtén un guion detallado en segundos.</p>
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="content-container">

      <mat-form-field style="width: 100%;" appearance="outline" class="idea-input">
        <mat-label>Escribe tu idea</mat-label>

        <textarea [(ngModel)]="idea" matInput placeholder="Ej: Cómo ser constante en redes sociales siendo principiante"
                  rows="5"></textarea>
      </mat-form-field>

      <div>
        <mat-spinner style="margin: 0 auto;" *ngIf="this.loadingCharacters" class="loading-spinner" color="accent"></mat-spinner>
      </div>

      <img *ngIf="selectedCharacter" [src]="selectedCharacter.image" alt="{{ selectedCharacter.name }}"
           class="character-image"/>

      <mat-form-field appearance="outline" class="character-select"
                      *ngIf="characters && characters.length > 0 && !this.loadingCharacters">
        <mat-label>Elige un personaje</mat-label>
        <mat-select [(value)]="selectedCharacter">
          <mat-option *ngFor="let character of characters" [value]="character">
            <div class="character-option">
              <img [src]="character.image" alt="{{ character.name }}" class="character-avatar"/>
              <div>
                <strong>{{ character.name }}</strong><br> -
                <small>{{ character.description }}</small>
              </div>
            </div>
          </mat-option>
        </mat-select>
      </mat-form-field>

      <button (click)="openEditDialog()" mat-stroked-button class="new-character-btn">Edita tu personaje</button>

      <!--      <div class="suggestions-section">-->
      <!--        <h3>Sugerencias basadas en tu idea</h3>-->
      <!--        <div class="badge-container">-->
      <!--          <mat-chip-listbox class="mat-mdc-chip-set-stacked" aria-label="Sugerencias">-->
      <!--            @for (idea of suggestions; track idea) {-->
      <!--              <mat-chip-option>{{idea}}</mat-chip-option>-->
      <!--            }-->
      <!--          </mat-chip-listbox>-->
      <!--        </div>-->
      <!--      </div>-->
    </div>
  </mat-card-content>
  <mat-card-actions>

    <button
      (click)="createLongVideoProject()"
      [disabled]="!this.selectedCharacter || this.idea.length < 1 || this.sendingData" mat-raised-button
      color="primary" class="generate-button">
      <span *ngIf="!this.sendingData && this.idea.length > 0">Generar guion</span>
      <span *ngIf="this.idea.length < 1">Escribe una idea de un vídeo</span>

      <mat-spinner *ngIf="this.sendingData" color="accent" diameter="20" class="loading-spinner"></mat-spinner>
    </button>
  </mat-card-actions>
</mat-card>
